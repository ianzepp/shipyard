interface:
  display_name: "Poker Face"
  short_description: "Cold-audit completed work against the original plan"
  default_prompt: "Use $poker-face to run a cold post-implementation completion audit: reread the original plan or requirement, reconstruct the requirement checklist, map each item to actual implementation evidence, identify high/medium/low misses, and route material misses to rework (inside factory, slicer rework mode (a), then rerun verification, poker-face, and review for the affected scope; standalone, return to implementation)."
